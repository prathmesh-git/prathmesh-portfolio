services:
  - type: web
    name: prathmesh-portfolio-api
    runtime: node
    buildCommand: npm install && npm run build --workspace backend
    startCommand: npm start --workspace backend
    healthCheckPath: /api/health
    envVars:
      - key: GROQ_MODEL
        value: openai/gpt-oss-20b
      - key: FRONTEND_ORIGIN
        sync: false
